server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    
    server_name _;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    location /img/ {
        root /usr/share/nginx/;
    }

    location /javascript/ {
        root /usr/share/nginx/;
    }

    location /goodservices/ {
        proxy_pass http://backend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}