<!DOCTYPE html>
<html>
  <head>
      <title>Formulario de reserva</title>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="font-serif">
    <div class="bg-[url('./../img/background_nav.jpeg')] bg-cover bg-center h-screen w-screen">
      <nav id="nav" class="flex items-center justify-between fixed top-0 left-0 w-full z-50 text-white transition-colors duration-2000 bg-black px-4 py-4">
        <!-- Logo -->
        <div class="flex items-center">
        <img src="./../img/icono.png" alt="Logo" class="h-10 w-auto">
        </div>

        <!-- Menu escritorio -->
        <ul class="hidden md:flex space-x-8 text-white font-semibold">
          <li class="flex items-center justify-center p-6 mr-10 xl:mr-30 hover:text-yellow-400 transition"><a href="./index.html">Servicios</a></li>
          <li class="flex items-center justify-center p-6 mr-10 xl:mr-30 hover:text-yellow-400 transition"><a href="./reservas.html">Reservas</a></li>
        </ul>

        <!-- Botón hamburguesa móvil -->
        <button id="menu-btn" class="md:hidden focus:outline-none" aria-label="Toggle menu">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" 
              viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

      </nav>

      <!-- Menú desplegable móvil -->
      <div id="menu" class="hidden flex-col items-center bg-white text-gray-800 fixed top-16 right-0 w-full md:hidden z-40 shadow-md rounded-b-xl transition-all duration-300">
          <a href="./index.html" class="block w-full text-center py-4 font-semibold hover:bg-yellow-100 hover:text-black transition">Servicios</a>
          <a href="./reservas.html" class="block w-full text-center py-4 font-semibold hover:bg-yellow-100 hover:text-black transition">Reservas</a>
      </div>

        <!-- Contenido opcional centrado -->
      <div class="flex flex-col items-center justify-end h-full">
          <h1 class="text-white text-3xl font-bold p-4 rounded pb-40 lg:text-6xl lg:pb-50 xl:pb-70">
              Agenda tu cita
          </h1>
      </div>
    </div>
    <form id="formulario-reserva" action="http://localhost:8000/reservas" method="post"
        class="bg-white p-8 rounded-xl shadow-md w-[90%] max-w-2xl xl:w-3/4 mx-auto mt-20 space-y-6">

      <div>
        <label for="nombre" class="block mb-1 font-medium text-gray-700">Nombre</label>
        <input type="text" name="nombre" id="nombre" required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <div>
        <label for="apellido" class="block mb-1 font-medium text-gray-700">Apellido</label>
        <input type="text" name="apellido" id="apellido" required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <div>
        <label for="correo" class="block mb-1 font-medium text-gray-700">Correo electrónico</label>
        <input type="email" name="correo" id="correo" required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <div>
        <label for="empleado_id" class="block mb-1 font-medium text-gray-700">Selecciona un empleado</label>
        <select name="empleado_id" id="empleado_id" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
          <option value="1">María González</option>
          <option value="2">Carlos Pérez</option>
          <option value="3">Laura Ramírez</option>
        </select>
      </div>

      <div>
        <label for="servicio_id" class="block mb-1 font-medium text-gray-700">Selecciona un servicio</label>
        <select name="servicio_id" id="servicio_id" required
                class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
        </select>
      </div>

      <div>
        <label for="fecha_reserva" class="block mb-1 font-medium text-gray-700">Fecha</label>
        <input type="date" name="fecha_reserva" id="fecha_reserva" required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <div>
        <label for="hora_reserva" class="block mb-1 font-medium text-gray-700">Hora</label>
        <input type="time" name="hora_reserva" id="hora_reserva" min="09:00" max="20:00" required
              class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400"/>
      </div>

      <button type="submit"
              class="mt-6 w-full inline-block bg-black text-white px-6 py-2 rounded-full hover:bg-gray-400 transition">
        Reservar
      </button>
    </form>
    <footer class="bg-gray-900 text-white py-6 mt-5">
      <div class="container mx-auto text-center">
          <p class="text-sm">&copy; <span class="font-semibold">BookMe BarberShop</span> — Todos los derechos reservados</p>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded",()=>{
        const btn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');
        const nav = document.getElementById('nav');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });

        window.addEventListener('scroll', () => {
            if(window.scrollY > 20) {
                // Añadir fondo usando clases Tailwind
                nav.classList.remove('bg-transparent');
                nav.classList.add('bg-black', 'bg-opacity-80', 'backdrop-blur-sm');
            } else {
                // Volver transparente
                nav.classList.add('bg-transparent');
                nav.classList.remove('bg-black', 'bg-opacity-80', 'backdrop-blur-sm');
            }
        });


        const select_servicio = document.getElementById("servicio_id");
        const opcion_servicio = document.createElement("option");
        opcion_servicio.value = localStorage.getItem('id_servicio');
        opcion_servicio.textContent = localStorage.getItem('servicio')
        opcion_servicio.selected = true;
        select_servicio.appendChild(opcion_servicio)
      })
    
    </script>
    <script src="./../javascript/crear_reserva.js"></script>

    -->

  </body>
</html>
