      <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Formulario de Reserva</title>
</head>
<body>
      <h2>Reserva tu cita</h2>
      <form id="formulario-reserva" action="http://localhost:8000/reservas" method="post">
          <input type="text" name="nombre" placeholder="Nombre" required /><br />
          <input type="text" name="apellido" placeholder="Apellido" required /><br />
          <input type="email" name="correo" placeholder="Correo electrónico" required /><br />

          <label for="empleado_id">Selecciona un empleado:</label><br />
          <select name="empleado_id" id="empleado_id" required>
              <option value="1">María González</option>
              <option value="2">Carlos Pérez</option>
              <option value="3">Laura Ramírez</option>
          </select><br />

          <label for="servicio_id">Selecciona un servicio:</label><br />
          <select name="servicio_id" id="servicio_id" required>
              <option value="1">Corte de cabello</option>
              <option value="2">Peinado</option>
              <option value="3">Coloración</option>
              <option value="4">Alisado</option>
              <option value="5">Tratamiento capilar</option>
          </select><br />

          <input type="date" name="fecha_reserva" required /><br />
          <input type="time" name="hora_reserva" required /><br />

          <button type="submit">Reservar</button>
      </form>
